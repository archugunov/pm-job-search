<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge Calibration — grade-judge</title>
<style>
  :root {
    --ground: #f4f5f7;
    --surface: #ffffff;
    --ink: #1a1f26;
    --muted: #646d7a;
    --rule: #dfe3e9;
    --accent: #b4530f;
    --agree: #1e7f4f;
    --agree-bg: #e4f1e9;
    --disagree: #b3403a;
    --disagree-bg: #f8e6e4;
    --borderline: #96660f;
    --borderline-bg: #f6edd8;
    --mono-bg: #eff1f4;
    --highlight-bg: #d8e8fb;
    --highlight-ink: #1a1f26;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15181d;
      --surface: #1d2128;
      --ink: #e6e9ed;
      --muted: #959daa;
      --rule: #2d333d;
      --accent: #e8935a;
      --agree: #5cc78f;
      --agree-bg: #1a3226;
      --disagree: #e58a84;
      --disagree-bg: #3a2321;
      --borderline: #dcae55;
      --borderline-bg: #372f1b;
      --mono-bg: #242932;
      --highlight-bg: #1f3a54;
      --highlight-ink: #e6e9ed;
    }
  }

  :root[data-theme="dark"] {
    --ground: #15181d;
    --surface: #1d2128;
    --ink: #e6e9ed;
    --muted: #959daa;
    --rule: #2d333d;
    --accent: #e8935a;
    --agree: #5cc78f;
    --agree-bg: #1a3226;
    --disagree: #e58a84;
    --disagree-bg: #3a2321;
    --borderline: #dcae55;
    --borderline-bg: #372f1b;
    --mono-bg: #242932;
    --highlight-bg: #1f3a54;
    --highlight-ink: #e6e9ed;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 1.25rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  a { color: var(--accent); }

  h1, h2, h3 { line-height: 1.25; margin: 0 0 0.5rem; }
  h1 { font-size: 1.15rem; }
  h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  h3 { font-size: 0.95rem; }

  button, input, textarea, select {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }

  button {
    background: var(--surface);
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: 0.4rem;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.link {
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    padding: 0;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  input[type="text"], input[type="number"], textarea, select {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0.35rem;
    padding: 0.35rem 0.5rem;
    width: 100%;
  }

  textarea { resize: vertical; min-height: 5rem; }

  .mono, code, pre {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .tabular-nums { font-variant-numeric: tabular-nums; }

  .app {
    display: grid;
    grid-template-columns: 19rem 1fr 24rem;
    grid-template-areas: "sidebar findings context";
    gap: 1.5rem;
    align-items: start;
    max-width: 104rem;
    margin: 0 auto;
  }

  @media (max-width: 1200px) {
    .app {
      grid-template-columns: 19rem 1fr;
      grid-template-areas:
        "sidebar findings"
        "sidebar context";
    }
  }

  @media (max-width: 900px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-areas:
        "sidebar"
        "findings"
        "context";
    }
    .sidebar, .context-pane { position: static !important; max-height: none !important; }
  }

  .sidebar {
    grid-area: sidebar;
    position: sticky;
    top: 1.25rem;
    max-height: calc(100vh - 2.5rem);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0.6rem;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .runs {
    grid-area: findings;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    min-width: 0;
  }

  .context-pane {
    grid-area: context;
    position: sticky;
    top: 1.25rem;
    max-height: calc(100vh - 2.5rem);
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0.6rem;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    min-width: 0;
  }

  .context-header { display: flex; flex-direction: column; gap: 0.5rem; }
  .context-run-select { font-size: 0.82rem; }

  .tab-row { display: flex; gap: 0.4rem; }
  .tab-btn {
    flex: 1;
    font-size: 0.82rem;
    padding: 0.35rem 0.5rem;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .context-body { font-size: 0.82rem; min-width: 0; }
  .context-empty {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 1rem 0;
  }

  .transcript-preamble, .rubric-text {
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 0.75rem;
  }
  .rubric-text { color: var(--ink); }

  .turn-block {
    border-radius: 0.4rem;
    padding: 0.4rem 0.5rem;
    margin-bottom: 0.5rem;
  }
  .turn-block.turn-highlight {
    background: var(--highlight-bg);
    color: var(--highlight-ink);
  }
  .turn-heading {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin: 0.6rem 0 0.2rem;
    scroll-margin-top: 1rem;
  }
  .turn-body {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.8rem;
    margin: 0;
  }

  .tier-picker { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
  .tier-picker button { font-size: 0.78rem; padding: 0.3rem 0.5rem; }
  .tier-picker button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .dropzone {
    border: 2px dashed var(--rule);
    border-radius: 0.5rem;
    padding: 1rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .dropzone.dragover {
    border-color: var(--accent);
    color: var(--ink);
  }

  .picker-row { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
  .picker-row label { font-size: 0.78rem; color: var(--muted); }

  .readout { font-size: 0.85rem; }
  .readout .tier-row {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.25rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .readout .tier-row.thin { opacity: 0.55; }
  .readout .thin-note { font-size: 0.72rem; color: var(--muted); }
  .readout .contradiction-line { font-size: 0.78rem; color: var(--borderline); padding: 0.2rem 0; }
  .readout .gate-line {
    margin-top: 0.5rem;
    padding: 0.5rem;
    border-radius: 0.4rem;
    font-weight: 600;
  }
  .gate-pass { background: var(--agree-bg); color: var(--agree); }
  .gate-fail { background: var(--disagree-bg); color: var(--disagree); }

  .global-actions { display: flex; flex-direction: column; gap: 0.4rem; }

  .run {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0.6rem;
    padding: 1rem;
    overflow-x: auto;
  }
  .run-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
  }
  .run-header .run-id-input { max-width: 20rem; }
  .run-header .filename { font-size: 0.78rem; color: var(--muted); word-break: break-all; }
  .badge {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: var(--borderline-bg);
    color: var(--borderline);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .verdict-block {
    border: 1px solid var(--rule);
    border-radius: 0.5rem;
    padding: 0.7rem 0.8rem;
    margin-bottom: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .verdict-control-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.85rem; }
  .verdict-label { min-width: 7.5rem; font-weight: 600; }
  .pf-group { display: flex; gap: 0.3rem; }
  .pf-btn { font-size: 0.8rem; padding: 0.25rem 0.6rem; }
  .pf-btn.active-pass { background: var(--agree-bg); color: var(--agree); border-color: var(--agree); }
  .pf-btn.active-fail { background: var(--disagree-bg); color: var(--disagree); border-color: var(--disagree); }
  .verdict-chip {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: var(--mono-bg);
    font-size: 0.78rem;
  }
  .derived-overall {
    font-weight: 600;
    padding: 0.3rem 0.5rem;
    border-radius: 0.35rem;
    background: var(--mono-bg);
    font-size: 0.85rem;
    width: fit-content;
  }
  .derived-overall.gate-pass, .derived-overall.gate-fail { width: fit-content; }
  .contradiction-note {
    font-size: 0.78rem;
    color: var(--borderline);
    background: var(--borderline-bg);
    border-radius: 0.35rem;
    padding: 0.4rem 0.5rem;
  }
  .advisory-note { margin: 0; }

  .blind-gate {
    border: 1px dashed var(--rule);
    border-radius: 0.5rem;
    padding: 0.9rem;
    background: var(--mono-bg);
  }
  .blind-gate p.title { font-weight: 600; margin: 0 0 0.5rem; }
  .blind-actions { display: flex; align-items: center; gap: 0.9rem; margin-top: 0.6rem; }

  .blind-summary {
    font-size: 0.82rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }
  .blind-summary input[type="number"] { width: 5rem; }

  .no-judge-note {
    color: var(--muted);
    font-size: 0.85rem;
    border: 1px dashed var(--rule);
    border-radius: 0.5rem;
    padding: 0.8rem;
  }

  .tier-group { margin-bottom: 1rem; }
  .tier-group-heading {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .tier-chip {
    text-transform: uppercase;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    padding: 0.1rem 0.4rem;
    border-radius: 0.3rem;
    background: var(--mono-bg);
    color: var(--ink);
  }

  .criterion-chip {
    display: inline-block;
    text-transform: uppercase;
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    padding: 0.1rem 0.4rem;
    border-radius: 0.3rem;
    margin-left: 0.3rem;
  }
  .criterion-chip.agree { background: var(--agree-bg); color: var(--agree); }
  .criterion-chip.disagree { background: var(--disagree-bg); color: var(--disagree); }
  .criterion-chip.borderline { background: var(--borderline-bg); color: var(--borderline); }

  .spec-group-hint { margin: 0 0 0.5rem; }

  .finding-card {
    border-left: 3px dashed var(--muted);
    background: var(--mono-bg);
    border-radius: 0.35rem;
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.6rem;
  }
  .finding-card.state-agree { border-left-style: solid; border-left-color: var(--agree); }
  .finding-card.state-disagree { border-left-style: solid; border-left-color: var(--disagree); }
  .finding-card.state-borderline { border-left-style: solid; border-left-color: var(--borderline); }

  .finding-summary {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--mono-bg);
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.82rem;
    padding: 0.4rem 0.5rem;
    border-radius: 0.3rem;
    margin: 0.3rem 0 0.5rem;
  }

  .turn-link {
    font-size: 0.75rem;
    padding: 0.15rem 0.45rem;
    margin: 0 0 0.4rem;
  }

  .label-row { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .label-btn {
    border-radius: 0.3rem;
    padding: 0.25rem 0.6rem;
    font-size: 0.8rem;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .label-btn[data-choice="agree"].active { background: var(--agree-bg); color: var(--agree); border-color: var(--agree); }
  .label-btn[data-choice="disagree"].active { background: var(--disagree-bg); color: var(--disagree); border-color: var(--disagree); }
  .label-btn[data-choice="borderline"].active { background: var(--borderline-bg); color: var(--borderline); border-color: var(--borderline); }
  .note-input { flex: 1 1 10rem; min-width: 8rem; }

  .run-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.75rem;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .empty-state {
    color: var(--muted);
    font-size: 0.9rem;
    border: 1px dashed var(--rule);
    border-radius: 0.5rem;
    padding: 1.5rem;
    text-align: center;
  }

  .hint { font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Judge calibration</h1>
    <p class="hint">Drop the <code>runs/</code> folder (judge output + transcripts) and the <code>rubrics/</code> folder. Everything stays in this browser tab — no network calls.</p>

    <div id="dropzone" class="dropzone">Drop the <code>runs/</code> folder and the <code>rubrics/</code> folder here</div>

    <div class="picker-row">
      <label for="filePicker">Choose files</label>
      <input type="file" id="filePicker" multiple accept=".md">
    </div>
    <div class="picker-row">
      <label for="dirPicker">Choose a folder</label>
      <input type="file" id="dirPicker" webkitdirectory multiple>
    </div>

    <section>
      <h2>Readout</h2>
      <div id="readout" class="readout tabular-nums"></div>
    </section>

    <section class="global-actions">
      <h2>Export</h2>
      <button id="downloadAllBtn">Download all</button>
      <button id="copyAllBtn">Copy all as JSON</button>
      <button id="clearAllBtn">Clear everything</button>
    </section>
  </aside>

  <main class="runs" id="runsContainer">
    <div class="empty-state" id="emptyState">No runs loaded yet.</div>
  </main>

  <aside class="context-pane" id="contextPane"></aside>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Parsing — standalone, no DOM references. Copy-pasteable for testing.
  // ---------------------------------------------------------------------
  function parseJudgeFile(text, filename) {
    var norm = String(text).replace(/\r\n/g, "\n");

    var parts = String(filename).split("/");
    var base = parts[parts.length - 1];
    var stem = base.replace(/\.judge\.md$/i, "").replace(/\.md$/i, "");
    var id = parts.length > 1 ? parts[parts.length - 2] + "/" + stem : stem;

    var verdictMatch = norm.match(/^\*\*Overall:\s*(.+?)\*\*/m);
    var overall = verdictMatch ? verdictMatch[1].trim() : null;

    var hardMatch = norm.match(/^-\s*Hard violations:\s*(PASS|FAIL)\b/im);
    var specMatch = norm.match(/^-\s*Spec gaps:\s*(PASS|FAIL)\b/im);
    var softMatch = norm.match(/^-\s*Soft issues:\s*(\d+)/im);
    var critiqueMatch = norm.match(/^-\s*Open critiques:\s*(\d+)/im);

    var verdicts = {
      hard: { judge: hardMatch ? hardMatch[1] : null, human: null },
      spec: { judge: specMatch ? specMatch[1] : null, human: null },
      overall: { judge: overall, human: null }
    };
    var advisory = {
      soft_count: softMatch ? parseInt(softMatch[1], 10) : 0,
      critique_count: critiqueMatch ? parseInt(critiqueMatch[1], 10) : 0
    };

    var tierMap = [
      ["Hard violations", "hard"],
      ["Soft issues", "soft"],
      ["Spec gaps", "spec"],
      ["Open critique", "critique"]
    ];

    var headingRe = /^## (.+)$/gm;
    var headings = [];
    var m;
    while ((m = headingRe.exec(norm)) !== null) {
      headings.push({
        title: m[1].trim(),
        start: m.index,
        contentStart: m.index + m[0].length
      });
    }

    var findings = [];
    var ignored = {};

    for (var i = 0; i < headings.length; i++) {
      var h = headings[i];
      var tier = null;
      for (var j = 0; j < tierMap.length; j++) {
        if (h.title.indexOf(tierMap[j][0]) !== -1) {
          tier = tierMap[j][1];
          break;
        }
      }
      if (!tier) continue;

      var end = (i + 1 < headings.length) ? headings[i + 1].start : norm.length;
      var body = norm.slice(h.contentStart, end);
      var lines = body.split("\n");

      var bulletLines = [];
      var hasNoneMarker = false;
      for (var k = 0; k < lines.length; k++) {
        var line = lines[k];
        if (/^- /.test(line)) {
          bulletLines.push(line.replace(/^- /, ""));
        } else if (/^No .*(found|critiques)\.?$/i.test(line.trim())) {
          hasNoneMarker = true;
        }
      }

      if (hasNoneMarker) {
        ignored[tier] = (ignored[tier] || 0) + bulletLines.length;
        continue;
      }

      for (var b = 0; b < bulletLines.length; b++) {
        var summary = bulletLines[b];
        var turnMatch = summary.match(/turn\s+(\d+)/i);
        // Spec-gaps bullets carry the judge's own per-criterion verdict
        // right after the bolded criterion, e.g. "**End-of-run nudge:**
        // PASS — Turn 8 ends with...". Surfaced as a read-only chip in the
        // UI so a human adjudicating "is this PASS call right" isn't
        // staring at an unlabelled wall of bullets. Not exported — it's a
        // presentation aid over data that's already in `summary`.
        var criterionMatch = summary.match(/^\*\*.+?:\*\*\s*(PASS|FAIL|NOT EXERCISED|NOT APPLICABLE)\b/);
        findings.push({
          tier: tier,
          summary: summary,
          human: null,
          note: null,
          turn: turnMatch ? parseInt(turnMatch[1], 10) : null,
          criterionVerdict: criterionMatch ? criterionMatch[1] : null
        });
      }
    }

    return {
      id: id,
      filename: filename,
      verdicts: verdicts,
      advisory: advisory,
      findings: findings,
      ignored: ignored
    };
  }

  // Splits a transcript into its preamble plus `## Turn N — ROLE` blocks.
  // No DOM references — rendering builds elements from this structure.
  function parseTranscript(text, filename) {
    var norm = String(text).replace(/\r\n/g, "\n");
    var headingRe = /^## Turn\s+(\d+)\s*[-–—]\s*(USER|ASSISTANT)\s*$/gim;
    var matches = [];
    var m;
    while ((m = headingRe.exec(norm)) !== null) {
      matches.push({
        n: parseInt(m[1], 10),
        role: m[2].toUpperCase(),
        headingText: m[0].replace(/^##\s*/, "").trim(),
        start: m.index,
        contentStart: m.index + m[0].length
      });
    }

    var preamble = matches.length ? norm.slice(0, matches[0].start).trim() : norm.trim();
    var turns = [];
    for (var i = 0; i < matches.length; i++) {
      var end = (i + 1 < matches.length) ? matches[i + 1].start : norm.length;
      var body = norm.slice(matches[i].contentStart, end).replace(/^\n+/, "").replace(/\n+$/, "");
      turns.push({
        n: matches[i].n,
        role: matches[i].role,
        id: "turn-" + matches[i].n + "-" + matches[i].role.toLowerCase(),
        heading: matches[i].headingText,
        body: body
      });
    }

    return { filename: filename, preamble: preamble, turns: turns };
  }

  // Classifies a dropped file by its path per the corpus layout:
  // runs/<date>/<persona-journey>.judge.md + .md (transcript), plus the
  // four fixed rubric filenames, wherever they land. SUMMARY.md is inert.
  var RUBRIC_TIER_BY_FILENAME = {
    "lint-checklist.md": "hard",
    "tone.md": "soft",
    "spec-criteria.md": "spec",
    "open-critique.md": "critique"
  };
  var RUBRIC_FILENAME_BY_TIER = {
    hard: "lint-checklist.md",
    soft: "tone.md",
    spec: "spec-criteria.md",
    critique: "open-critique.md"
  };

  function idFromParts(parts, stem) {
    return parts.length > 1 ? parts[parts.length - 2] + "/" + stem : stem;
  }

  function classifyPath(path) {
    var parts = String(path).split("/");
    var base = parts[parts.length - 1];

    if (base === "SUMMARY.md") return { kind: "ignore" };
    if (RUBRIC_TIER_BY_FILENAME.hasOwnProperty(base)) {
      return { kind: "rubric", tier: RUBRIC_TIER_BY_FILENAME[base] };
    }
    if (/\.judge\.md$/i.test(base)) {
      var jstem = base.replace(/\.judge\.md$/i, "");
      return { kind: "judge", id: idFromParts(parts, jstem) };
    }
    if (/\.md$/i.test(base)) {
      var tstem = base.replace(/\.md$/i, "");
      return { kind: "transcript", id: idFromParts(parts, tstem) };
    }
    return { kind: "ignore" };
  }

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var TIERS = ["hard", "soft", "spec", "critique"];
  var TIER_LABEL = { hard: "Hard", soft: "Soft", spec: "Spec", critique: "Critique" };
  var STORAGE_PREFIX = "judge-calibration/";

  var runs = []; // ordered array of run state objects
  var rubrics = { hard: null, soft: null, spec: null, critique: null }; // {text, filename}

  // Context pane selection — independent of any single run's DOM node so
  // it survives the findings list re-rendering underneath it.
  var contextState = { runKey: null, tab: "transcript", turn: null, tier: null };

  function isValidPF(v) { return v === "PASS" || v === "FAIL" || v === null || v === undefined; }

  function emptyVerdicts() {
    return {
      hard: { judge: null, human: null },
      spec: { judge: null, human: null },
      overall: { judge: null, human: null }
    };
  }

  function deriveOverall(hardHuman, specHuman) {
    if (hardHuman === "FAIL" || specHuman === "FAIL") return "FAIL";
    if (hardHuman === "PASS" && specHuman === "PASS") return "PASS";
    return null;
  }

  function selfContradiction(run) {
    var v = run.verdicts;
    if (v.hard.judge == null || v.spec.judge == null || v.overall.judge == null) return null;
    var derivedPass = v.hard.judge === "PASS" && v.spec.judge === "PASS";
    var statesPass = v.overall.judge.indexOf("PASS") === 0;
    if (statesPass === derivedPass) return null;
    return "judge self-contradiction: states " + v.overall.judge + " but its own sub-verdicts give " + (derivedPass ? "PASS" : "FAIL");
  }

  // Storage keys are derived from `run.key` — the id parsed from the file
  // path/stem at drop time. `run.id` is the user-editable display/export
  // value. Keeping these separate means renaming a run in the UI never
  // orphans its localStorage entry: the key that labels are saved under
  // never changes just because the display id did.
  function storageKey(key) { return STORAGE_PREFIX + key; }

  function saveRun(run) {
    var payload = {
      id: run.id,
      verdicts: {
        hard: { human: run.verdicts.hard.human },
        spec: { human: run.verdicts.spec.human }
      },
      findings: run.findings.map(function (f) { return { human: f.human, note: f.note }; }),
      blind: run.blind,
      revealed: run.revealed,
      blindSkipped: run.blindSkipped,
      blindText: run.blindText
    };
    try {
      localStorage.setItem(storageKey(run.key), JSON.stringify(payload));
    } catch (e) { /* storage unavailable — ignore, tool still works in-memory */ }
  }

  function loadRunLabels(key) {
    try {
      var raw = localStorage.getItem(storageKey(key));
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function applyStoredLabels(run) {
    var stored = loadRunLabels(run.key);
    if (!stored) return;
    if (typeof stored.id === "string" && stored.id) run.id = stored.id;
    if (stored.verdicts) {
      var sh = stored.verdicts.hard && stored.verdicts.hard.human;
      var ss = stored.verdicts.spec && stored.verdicts.spec.human;
      if (isValidPF(sh)) run.verdicts.hard.human = sh || null;
      if (isValidPF(ss)) run.verdicts.spec.human = ss || null;
    }
    if (stored.blind !== undefined) run.blind = stored.blind;
    if (stored.revealed) run.revealed = true;
    if (stored.blindSkipped) run.blindSkipped = true;
    if (typeof stored.blindText === "string") run.blindText = stored.blindText;
    if (Array.isArray(stored.findings)) {
      for (var i = 0; i < run.findings.length && i < stored.findings.length; i++) {
        var h = stored.findings[i].human;
        run.findings[i].human = (h === "agree" || h === "disagree" || h === "borderline") ? h : null;
        run.findings[i].note = stored.findings[i].note || null;
      }
    }
  }

  function findRunIndex(key) {
    for (var i = 0; i < runs.length; i++) {
      if (runs[i].key === key) return i;
    }
    return -1;
  }

  function upsertRun(id, filename, payload) {
    var idx = findRunIndex(id);
    var run = idx >= 0 ? runs[idx] : {
      key: id,
      id: id,
      judgeFilename: null,
      transcriptFilename: null,
      transcriptOnly: true,
      verdicts: emptyVerdicts(),
      advisory: { soft_count: 0, critique_count: 0 },
      findings: [],
      ignored: {},
      transcript: null,
      blind: null,
      revealed: false,
      blindSkipped: false,
      blindText: ""
    };

    if (payload.judge) {
      run.judgeFilename = filename;
      run.transcriptOnly = false;
      run.verdicts = payload.judge.verdicts;
      run.advisory = payload.judge.advisory;
      run.findings = payload.judge.findings;
      run.ignored = payload.judge.ignored;
    }
    if (payload.transcript) {
      run.transcriptFilename = filename;
      run.transcript = payload.transcript;
    }

    applyStoredLabels(run);
    if (idx >= 0) runs[idx] = run; else runs.push(run);
    if (!contextState.runKey) contextState.runKey = run.key;
  }

  // ---------------------------------------------------------------------
  // Readout math (mirrors tests/judge-calibration/stats.py)
  // ---------------------------------------------------------------------
  function computeStats() {
    var perTier = {};
    TIERS.forEach(function (t) { perTier[t] = { agree: 0, disagree: 0, borderline: 0, unlabelled: 0 }; });

    runs.forEach(function (run) {
      run.findings.forEach(function (f) {
        if (!perTier[f.tier]) perTier[f.tier] = { agree: 0, disagree: 0, borderline: 0, unlabelled: 0 };
        var t = perTier[f.tier];
        if (f.human === "agree") t.agree++;
        else if (f.human === "disagree") t.disagree++;
        else if (f.human === "borderline") t.borderline++;
        else t.unlabelled++;
      });
    });

    var recallNum = 0, recallDen = 0, hasBlind = false;
    runs.forEach(function (run) {
      if (run.blind) {
        hasBlind = true;
        recallNum += Number(run.blind.judge_matched) || 0;
        recallDen += Number(run.blind.human_found) || 0;
      }
    });
    var recall = (hasBlind && recallDen > 0) ? (recallNum / recallDen) : null;

    var hardAgreement = { hits: 0, total: 0 };
    var specAgreement = { hits: 0, total: 0 };
    var overallAgreement = { hits: 0, total: 0 };
    var contradictions = [];
    var softTotal = 0, critiqueTotal = 0;

    runs.forEach(function (run) {
      // Judge-derived fields (verdicts.*.judge, advisory counts,
      // self-contradiction) exist in memory the moment a judge file is
      // parsed — independent of this run's blind-pass reveal. Excluding
      // unrevealed runs here keeps the sidebar readout from leaking a
      // count or verdict for a run whose blind pass is still in progress.
      if (!run.revealed) return;
      var v = run.verdicts;
      if (v.hard.human != null && v.hard.judge != null) {
        hardAgreement.total++;
        if ((v.hard.judge.indexOf("PASS") === 0) === (v.hard.human.indexOf("PASS") === 0)) hardAgreement.hits++;
      }
      if (v.spec.human != null && v.spec.judge != null) {
        specAgreement.total++;
        if ((v.spec.judge.indexOf("PASS") === 0) === (v.spec.human.indexOf("PASS") === 0)) specAgreement.hits++;
      }
      var derivedHuman = deriveOverall(v.hard.human, v.spec.human);
      if (derivedHuman != null && v.overall.judge != null) {
        overallAgreement.total++;
        if ((v.overall.judge.indexOf("PASS") === 0) === (derivedHuman === "PASS")) overallAgreement.hits++;
      }
      if (selfContradiction(run)) contradictions.push(run.id);

      softTotal += run.advisory.soft_count || 0;
      critiqueTotal += run.advisory.critique_count || 0;
    });

    var gatePass = true;
    var gateReasons = [];
    TIERS.forEach(function (t) {
      var s = perTier[t];
      var n = s.agree + s.disagree;
      if (n >= 5) {
        var p = s.agree / n;
        if (p < 0.9) {
          gatePass = false;
          gateReasons.push(TIER_LABEL[t] + " precision " + p.toFixed(2) + " < 0.9");
        }
      }
    });
    if (hasBlind && recall !== null && recall < 0.8) {
      gatePass = false;
      gateReasons.push("recall " + recall.toFixed(2) + " < 0.8");
    }

    return {
      perTier: perTier,
      recall: recall,
      hasBlind: hasBlind,
      hardAgreement: hardAgreement,
      specAgreement: specAgreement,
      overallAgreement: overallAgreement,
      contradictions: contradictions,
      softTotal: softTotal,
      critiqueTotal: critiqueTotal,
      gatePass: gatePass,
      gateReasons: gateReasons
    };
  }

  function fmtPrecision(agree, disagree) {
    var n = agree + disagree;
    if (n === 0) return "no adjudicated findings";
    return (agree / n).toFixed(2) + " (" + agree + "/" + n + ")";
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  var runsContainer = document.getElementById("runsContainer");
  var emptyState = document.getElementById("emptyState");
  var readoutEl = document.getElementById("readout");
  var contextPane = document.getElementById("contextPane");

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else if (k === "class") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function renderReadout() {
    var stats = computeStats();
    readoutEl.innerHTML = "";

    TIERS.forEach(function (t) {
      var s = stats.perTier[t];
      var n = s.agree + s.disagree;
      var row = el("div", { class: "tier-row" + (n < 5 ? " thin" : "") });
      var label = TIER_LABEL[t] + ": " + fmtPrecision(s.agree, s.disagree);
      var right = "borderline " + s.borderline + " · unlabelled " + s.unlabelled;
      row.appendChild(el("span", { text: label }));
      row.appendChild(el("span", { text: right }));
      readoutEl.appendChild(row);
      if (n > 0 && n < 5) {
        readoutEl.appendChild(el("div", { class: "thin-note", text: "(thin — does not gate)" }));
      }
    });

    if (stats.hasBlind) {
      var recallRow = el("div", { class: "tier-row" });
      recallRow.appendChild(el("span", { text: "Recall" }));
      recallRow.appendChild(el("span", { text: stats.recall === null ? "n/a" : stats.recall.toFixed(2) }));
      readoutEl.appendChild(recallRow);
    }

    [["Hard verdict agreement", stats.hardAgreement], ["Spec verdict agreement", stats.specAgreement], ["Overall verdict agreement", stats.overallAgreement]].forEach(function (pair) {
      if (pair[1].total > 0) {
        var row = el("div", { class: "tier-row" });
        row.appendChild(el("span", { text: pair[0] }));
        row.appendChild(el("span", { text: pair[1].hits + "/" + pair[1].total }));
        readoutEl.appendChild(row);
      }
    });

    if (stats.contradictions.length > 0) {
      readoutEl.appendChild(el("div", {
        class: "contradiction-line",
        text: "judge self-contradiction: " + stats.contradictions.length + " run(s) — " + stats.contradictions.join(", ")
      }));
    }

    if (stats.softTotal > 0 || stats.critiqueTotal > 0) {
      var advRow = el("div", { class: "tier-row" });
      advRow.appendChild(el("span", { text: "Advisory" }));
      advRow.appendChild(el("span", { text: stats.softTotal + " soft, " + stats.critiqueTotal + " critiques" }));
      readoutEl.appendChild(advRow);
    }

    var gate = el("div", {
      class: "gate-line " + (stats.gatePass ? "gate-pass" : "gate-fail"),
      text: stats.gatePass ? "Gate: PASS" : "Gate: FAIL — " + stats.gateReasons.join("; ")
    });
    readoutEl.appendChild(gate);
  }

  function labelButton(run, finding, choice, labelText) {
    return el("button", {
      class: "label-btn" + (finding.human === choice ? " active" : ""),
      "data-choice": choice,
      type: "button",
      text: labelText,
      onclick: function () {
        finding.human = (finding.human === choice) ? null : choice;
        saveRun(run);
        renderAll();
      }
    });
  }

  function selectFindingContext(run, finding) {
    contextState.runKey = run.key;
    contextState.tab = "transcript";
    contextState.turn = finding.turn;
    contextState.tier = finding.tier;
    renderContextPane({ scroll: true });
  }

  function criterionChipClass(token) {
    if (token === "PASS") return "agree";
    if (token === "FAIL") return "disagree";
    return "borderline"; // NOT EXERCISED / NOT APPLICABLE
  }

  function renderFindingCard(run, finding) {
    var stateClass = finding.human ? " state-" + finding.human : "";
    var card = el("div", { class: "finding-card" + stateClass });
    card.appendChild(el("span", { class: "tier-chip", text: TIER_LABEL[finding.tier] || finding.tier }));
    if (finding.criterionVerdict) {
      card.appendChild(el("span", {
        class: "criterion-chip " + criterionChipClass(finding.criterionVerdict),
        text: finding.criterionVerdict
      }));
    }
    card.appendChild(el("div", { class: "finding-summary mono", text: finding.summary }));

    if (finding.turn != null) {
      card.appendChild(el("button", {
        class: "turn-link",
        type: "button",
        text: "turn " + finding.turn + " →",
        onclick: function () { selectFindingContext(run, finding); }
      }));
    }

    var labelRow = el("div", { class: "label-row" });
    labelRow.appendChild(labelButton(run, finding, "agree", "Agree"));
    labelRow.appendChild(labelButton(run, finding, "disagree", "Disagree"));
    labelRow.appendChild(labelButton(run, finding, "borderline", "Borderline"));

    var noteInput = el("input", {
      type: "text",
      class: "note-input",
      placeholder: "note",
      value: finding.note || "",
      oninput: function (e) {
        finding.note = e.target.value || null;
        saveRun(run);
      }
    });
    noteInput.value = finding.note || "";
    labelRow.appendChild(noteInput);

    card.appendChild(labelRow);
    return card;
  }

  function renderBlindGate(run, container) {
    var gate = el("div", { class: "blind-gate" });
    gate.appendChild(el("p", { class: "title", text: "Findings hidden — blind pass first" }));
    var textarea = el("textarea", {
      placeholder: "Your own findings, one per line",
      oninput: function (e) { run.blindText = e.target.value; }
    });
    textarea.value = run.blindText || "";
    gate.appendChild(textarea);

    var actions = el("div", { class: "blind-actions" });
    actions.appendChild(el("button", {
      class: "primary",
      text: "Reveal judge findings",
      onclick: function () {
        var lines = (textarea.value || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
        run.blind = { human_found: lines.length, judge_matched: 0 };
        run.revealed = true;
        saveRun(run);
        renderAll();
      }
    }));
    actions.appendChild(el("a", {
      href: "#",
      class: "link",
      text: "Skip blind pass",
      onclick: function (e) {
        e.preventDefault();
        run.blind = null;
        run.blindSkipped = true;
        run.revealed = true;
        saveRun(run);
        renderAll();
      }
    }));
    gate.appendChild(actions);
    container.appendChild(gate);
  }

  function renderBlindSummary(run, container) {
    if (!run.blind) return;
    var wrap = el("div", { class: "blind-summary" });
    wrap.appendChild(el("span", { text: "You found " + run.blind.human_found + ". Judge also found:" }));
    var input = el("input", {
      type: "number",
      min: "0",
      value: String(run.blind.judge_matched || 0),
      oninput: function (e) {
        run.blind.judge_matched = Number(e.target.value) || 0;
        saveRun(run);
        renderReadout();
      }
    });
    wrap.appendChild(input);
    container.appendChild(wrap);
  }

  function groupFindings(run) {
    var groups = {};
    TIERS.forEach(function (t) { groups[t] = []; });
    run.findings.forEach(function (f) {
      if (!groups[f.tier]) groups[f.tier] = [];
      groups[f.tier].push(f);
    });
    return groups;
  }

  function renderFindingsList(run, container) {
    var groups = groupFindings(run);
    TIERS.forEach(function (t) {
      var list = groups[t];
      var ignoredCount = run.ignored && run.ignored[t];
      if (list.length === 0 && !ignoredCount) return;
      var group = el("div", { class: "tier-group" });
      var countText = list.length === 0 && ignoredCount
        ? "0 (" + ignoredCount + " confirmation bullets ignored)"
        : String(list.length);
      group.appendChild(el("div", { class: "tier-group-heading", text: TIER_LABEL[t] + " — " + countText }));
      if (t === "spec" && list.length > 0) {
        group.appendChild(el("p", {
          class: "hint spec-group-hint",
          text: "Each bullet is the judge's own per-criterion verdict (chip on the left). You're grading whether that PASS / FAIL / NOT EXERCISED call is right — not only whether something is a violation."
        }));
      }
      list.forEach(function (f) { group.appendChild(renderFindingCard(run, f)); });
      container.appendChild(group);
    });
  }

  function pfButton(run, rubric, choice) {
    var active = run.verdicts[rubric].human === choice;
    return el("button", {
      class: "pf-btn" + (active ? " active-" + choice.toLowerCase() : ""),
      type: "button",
      text: choice,
      onclick: function () {
        run.verdicts[rubric].human = active ? null : choice;
        saveRun(run);
        renderAll();
      }
    });
  }

  function renderVerdictBlock(run) {
    var wrap = el("div", { class: "verdict-block" });

    [["hard", "Hard violations"], ["spec", "Spec gaps"]].forEach(function (pair) {
      var rubric = pair[0], label = pair[1];
      var row = el("div", { class: "verdict-control-row" });
      row.appendChild(el("span", { class: "verdict-label", text: label }));
      var group = el("div", { class: "pf-group" });
      group.appendChild(pfButton(run, rubric, "PASS"));
      group.appendChild(pfButton(run, rubric, "FAIL"));
      row.appendChild(group);
      row.appendChild(el("span", { class: "verdict-chip", text: "judge: " + (run.verdicts[rubric].judge || "—") }));
      wrap.appendChild(row);
    });

    var derived = deriveOverall(run.verdicts.hard.human, run.verdicts.spec.human);
    var derivedClass = derived === "PASS" ? " gate-pass" : derived === "FAIL" ? " gate-fail" : "";
    wrap.appendChild(el("div", {
      class: "derived-overall" + derivedClass,
      text: "Derived overall: " + (derived === null ? "not yet set" : derived) + " (judge stated: " + (run.verdicts.overall.judge || "—") + ")"
    }));

    var contradiction = selfContradiction(run);
    if (contradiction) {
      wrap.appendChild(el("div", { class: "contradiction-note", text: contradiction }));
    }

    wrap.appendChild(el("p", {
      class: "advisory-note hint",
      text: "Advisory — soft issues: " + (run.advisory.soft_count || 0) + ", open critiques: " + (run.advisory.critique_count || 0)
    }));

    return wrap;
  }

  function toExportObject(run) {
    return {
      run: run.id,
      verdicts: {
        hard: { judge: run.verdicts.hard.judge, human: run.verdicts.hard.human || null },
        spec: { judge: run.verdicts.spec.judge, human: run.verdicts.spec.human || null },
        overall: { judge: run.verdicts.overall.judge, human: deriveOverall(run.verdicts.hard.human, run.verdicts.spec.human) }
      },
      advisory: {
        soft_count: run.advisory.soft_count || 0,
        critique_count: run.advisory.critique_count || 0
      },
      findings: run.findings.map(function (f) {
        return { tier: f.tier, summary: f.summary, human: f.human || null, note: f.note || null };
      }),
      blind: run.blind || null
    };
  }

  function exportFilename(run) {
    return run.id.replace(/\//g, "->") + ".json";
  }

  function downloadJSON(filename, obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function isLabelled(run) {
    if (run.blind) return true;
    if (run.verdicts.hard.human || run.verdicts.spec.human) return true;
    return run.findings.some(function (f) { return f.human || f.note; });
  }

  function renderRun(run) {
    var section = el("section", { class: "run", "data-id": run.id });

    var header = el("div", { class: "run-header" });
    var idInput = el("input", {
      type: "text",
      class: "run-id-input",
      value: run.id,
      oninput: function (e) {
        run.id = e.target.value;
        saveRun(run);
      }
    });
    idInput.value = run.id;
    header.appendChild(idInput);
    var filenames = [run.judgeFilename, run.transcriptFilename].filter(Boolean).join(" + ");
    header.appendChild(el("span", { class: "filename", text: filenames }));
    if (run.transcriptOnly) {
      header.appendChild(el("span", { class: "badge", text: "transcript only — no judge file" }));
    }

    header.appendChild(el("button", {
      text: "Clear this run",
      onclick: function () {
        run.verdicts.hard.human = null;
        run.verdicts.spec.human = null;
        run.blind = null;
        run.revealed = false;
        run.blindSkipped = false;
        run.blindText = "";
        run.findings.forEach(function (f) { f.human = null; f.note = null; });
        try { localStorage.removeItem(storageKey(run.key)); } catch (e) {}
        renderAll();
      }
    }));

    section.appendChild(header);

    // Everything judge-derived — verdict chips, advisory counts, the
    // self-contradiction note, and the human PASS/FAIL controls — waits
    // behind the blind-pass reveal. Adjudicating a Hard-violations verdict
    // requires having seen the findings, so the controls live here too,
    // not above the gate.
    if (!run.revealed) {
      renderBlindGate(run, section);
    } else {
      renderBlindSummary(run, section);
      if (run.transcriptOnly) {
        section.appendChild(el("p", { class: "no-judge-note", text: "No judge file for this run — nothing to adjudicate. Read the transcript in the context pane." }));
      } else {
        section.appendChild(renderVerdictBlock(run));
        renderFindingsList(run, section);
      }
    }

    var footer = el("div", { class: "run-footer" });
    footer.appendChild(el("button", {
      text: "Download label JSON",
      onclick: function () { downloadJSON(exportFilename(run), toExportObject(run)); }
    }));
    section.appendChild(footer);

    return section;
  }

  function renderRuns() {
    runsContainer.innerHTML = "";
    if (runs.length === 0) {
      runsContainer.appendChild(emptyState);
      return;
    }
    runs.forEach(function (run) { runsContainer.appendChild(renderRun(run)); });
  }

  // ---------------------------------------------------------------------
  // Context pane — Transcript / Rubric tabs
  // ---------------------------------------------------------------------
  function currentContextRun() {
    if (!contextState.runKey) return null;
    var idx = findRunIndex(contextState.runKey);
    return idx >= 0 ? runs[idx] : null;
  }

  function renderRunSelect(container) {
    var select = el("select", {
      class: "context-run-select",
      onchange: function (e) {
        contextState.runKey = e.target.value || null;
        contextState.turn = null;
        renderContextPane();
      }
    });
    select.appendChild(el("option", { value: "", text: runs.length ? "Select a run…" : "No runs loaded" }));
    runs.forEach(function (run) {
      var opt = el("option", { value: run.key, text: run.id });
      if (run.key === contextState.runKey) opt.setAttribute("selected", "selected");
      select.appendChild(opt);
    });
    container.appendChild(select);
  }

  function renderTabs(container) {
    var row = el("div", { class: "tab-row" });
    [["transcript", "Transcript"], ["rubric", "Rubric"]].forEach(function (pair) {
      row.appendChild(el("button", {
        class: "tab-btn" + (contextState.tab === pair[0] ? " active" : ""),
        type: "button",
        text: pair[1],
        onclick: function () {
          contextState.tab = pair[0];
          renderContextPane({ scroll: true });
        }
      }));
    });
    container.appendChild(row);
  }

  function renderTranscriptBody(run, body) {
    if (!run || !run.transcript) {
      body.appendChild(el("div", { class: "context-empty", text: "No transcript loaded for this run yet. Drop its runs/<date>/<persona>-<journey>.md file." }));
      return;
    }
    var t = run.transcript;
    if (t.preamble) {
      body.appendChild(el("pre", { class: "transcript-preamble mono", text: t.preamble }));
    }
    t.turns.forEach(function (turn) {
      var isHighlighted = contextState.tab === "transcript" && contextState.turn === turn.n;
      var block = el("div", { class: "turn-block" + (isHighlighted ? " turn-highlight" : "") });
      block.appendChild(el("h3", { class: "turn-heading", id: turn.id, text: turn.heading }));
      block.appendChild(el("pre", { class: "turn-body mono", text: turn.body }));
      body.appendChild(block);
    });
    if (t.turns.length === 0 && !t.preamble) {
      body.appendChild(el("div", { class: "context-empty", text: "Transcript loaded but no ## Turn N — ROLE headers were found." }));
    }
  }

  function renderRubricBody(run, body) {
    if (!contextState.tier) {
      body.appendChild(el("p", { class: "hint", text: "Pick a rubric, or select a finding's turn control to jump straight to its tier." }));
      var picker = el("div", { class: "tier-picker" });
      TIERS.forEach(function (t) {
        picker.appendChild(el("button", {
          type: "button",
          text: TIER_LABEL[t] + " (" + RUBRIC_FILENAME_BY_TIER[t] + ")",
          onclick: function () {
            contextState.tier = t;
            renderContextPane();
          }
        }));
      });
      body.appendChild(picker);
      return;
    }

    var picker2 = el("div", { class: "tier-picker" });
    TIERS.forEach(function (t) {
      picker2.appendChild(el("button", {
        class: t === contextState.tier ? "active" : "",
        type: "button",
        text: TIER_LABEL[t],
        onclick: function () {
          contextState.tier = t;
          renderContextPane();
        }
      }));
    });
    body.appendChild(picker2);

    var rubric = rubrics[contextState.tier];
    if (!rubric) {
      body.appendChild(el("div", {
        class: "context-empty",
        text: "Rubric not loaded — drop plugin/skills/test-personas/rubrics/" + RUBRIC_FILENAME_BY_TIER[contextState.tier] + " (or the whole rubrics/ folder)."
      }));
      return;
    }
    body.appendChild(el("pre", { class: "rubric-text mono", text: rubric.text }));
  }

  function renderContextPane(opts) {
    opts = opts || {};
    contextPane.innerHTML = "";

    var header = el("div", { class: "context-header" });
    renderRunSelect(header);
    renderTabs(header);
    contextPane.appendChild(header);

    var body = el("div", { class: "context-body" });
    var run = currentContextRun();

    if (!run) {
      body.appendChild(el("div", { class: "context-empty", text: "Select a run above, or click a finding's turn control, to see its transcript and rubric here." }));
      contextPane.appendChild(body);
      return;
    }

    if (contextState.tab === "transcript") {
      renderTranscriptBody(run, body);
    } else {
      renderRubricBody(run, body);
    }
    contextPane.appendChild(body);

    if (opts.scroll && contextState.tab === "transcript" && contextState.turn != null) {
      var target = document.getElementById("turn-" + contextState.turn + "-user") ||
        document.getElementById("turn-" + contextState.turn + "-assistant");
      if (target) {
        var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      }
    }
  }

  function renderAll() {
    renderRuns();
    renderReadout();
    renderContextPane();
  }

  // ---------------------------------------------------------------------
  // File intake
  // ---------------------------------------------------------------------
  function ingestFileEntry(file, path) {
    return file.text().then(function (text) {
      var cls = classifyPath(path);
      if (cls.kind === "ignore") return;
      var norm = String(text).replace(/\r\n/g, "\n");
      if (cls.kind === "rubric") {
        rubrics[cls.tier] = { text: norm, filename: path };
        return;
      }
      if (cls.kind === "judge") {
        var parsed = parseJudgeFile(text, path);
        upsertRun(cls.id, path, { judge: parsed });
        return;
      }
      if (cls.kind === "transcript") {
        var pt = parseTranscript(text, path);
        upsertRun(cls.id, path, { transcript: pt });
        return;
      }
    });
  }

  function ingestFileList(fileList) {
    var jobs = [];
    for (var i = 0; i < fileList.length; i++) {
      var file = fileList[i];
      var path = file.webkitRelativePath || file.name;
      if (!/\.md$/i.test(path)) continue;
      jobs.push(ingestFileEntry(file, path));
    }
    return Promise.all(jobs).then(renderAll);
  }

  function walkEntry(entry, prefix, results) {
    return new Promise(function (resolve, reject) {
      if (entry.isFile) {
        entry.file(function (file) {
          results.push({ file: file, path: prefix + entry.name });
          resolve();
        }, reject);
      } else if (entry.isDirectory) {
        var reader = entry.createReader();
        var collected = [];
        (function readBatch() {
          reader.readEntries(function (batch) {
            if (!batch.length) {
              Promise.all(collected.map(function (e) { return walkEntry(e, prefix + entry.name + "/", results); }))
                .then(resolve, reject);
            } else {
              collected = collected.concat(batch);
              readBatch();
            }
          }, reject);
        })();
      } else {
        resolve();
      }
    });
  }

  function ingestDataTransfer(dataTransfer) {
    var items = dataTransfer.items;
    if (items && items.length && items[0].webkitGetAsEntry) {
      var entries = [];
      for (var i = 0; i < items.length; i++) {
        var entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
      var results = [];
      return Promise.all(entries.map(function (e) { return walkEntry(e, "", results); }))
        .then(function () {
          var jobs = results
            .filter(function (r) { return /\.md$/i.test(r.path); })
            .map(function (r) { return ingestFileEntry(r.file, r.path); });
          return Promise.all(jobs);
        })
        .then(renderAll);
    }
    return ingestFileList(dataTransfer.files);
  }

  // ---------------------------------------------------------------------
  // Wiring
  // ---------------------------------------------------------------------
  var dropzone = document.getElementById("dropzone");
  dropzone.addEventListener("dragover", function (e) {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });
  dropzone.addEventListener("dragleave", function () {
    dropzone.classList.remove("dragover");
  });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    ingestDataTransfer(e.dataTransfer);
  });

  document.getElementById("filePicker").addEventListener("change", function (e) {
    ingestFileList(e.target.files);
    e.target.value = "";
  });
  document.getElementById("dirPicker").addEventListener("change", function (e) {
    ingestFileList(e.target.files);
    e.target.value = "";
  });

  document.getElementById("downloadAllBtn").addEventListener("click", function () {
    runs.filter(isLabelled).forEach(function (run) {
      downloadJSON(exportFilename(run), toExportObject(run));
    });
  });

  document.getElementById("copyAllBtn").addEventListener("click", function () {
    var arr = runs.filter(isLabelled).map(toExportObject);
    var text = JSON.stringify(arr, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.getElementById("clearAllBtn").addEventListener("click", function () {
    if (!window.confirm("Clear all labels for every loaded run? This cannot be undone.")) return;
    try {
      var toRemove = [];
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && key.indexOf(STORAGE_PREFIX) === 0) toRemove.push(key);
      }
      toRemove.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
    runs.forEach(function (run) {
      run.verdicts.hard.human = null;
      run.verdicts.spec.human = null;
      run.blind = null;
      run.revealed = false;
      run.blindSkipped = false;
      run.blindText = "";
      run.findings.forEach(function (f) { f.human = null; f.note = null; });
    });
    renderAll();
  });

  renderAll();
})();
</script>
